<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary SEO Meta Tags -->
    <title>ZYRA - Premium Fashion & Lifestyle Store</title>
    <meta name="title" content="ZYRA - Premium Fashion & Lifestyle Store" />
    <meta name="description" content="Discover premium fashion at ZYRA. Shop the latest trends in men's and women's clothing, accessories, and lifestyle products. Free shipping on orders over $100." />
    <meta name="keywords" content="fashion, clothing, online shopping, men's fashion, women's fashion, accessories, lifestyle, premium wear" />
    <meta name="author" content="ZYRA" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://zyra.com/" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://zyra.com/" />
    <meta property="og:title" content="ZYRA - Premium Fashion & Lifestyle Store" />
    <meta property="og:description" content="Discover premium fashion at ZYRA. Shop the latest trends in men's and women's clothing, accessories, and lifestyle products. Free shipping on orders over $100." />
    <meta property="og:image" content="https://zyra.com/og-image.jpg" />
    <meta property="og:site_name" content="ZYRA" />
    <meta property="og:locale" content="en_US" />
    
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://zyra.com/" />
    <meta name="twitter:title" content="ZYRA - Premium Fashion & Lifestyle Store" />
    <meta name="twitter:description" content="Discover premium fashion at ZYRA. Shop the latest trends in men's and women's clothing, accessories, and lifestyle products." />
    <meta name="twitter:image" content="https://zyra.com/og-image.jpg" />
    
    <!-- Additional Meta Tags -->
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ZYRA" />
    <meta name="mobile-web-app-capable" content="yes" />
    
    <!-- Preload Critical Resources -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/inter-var.woff2" />
    
    <!-- DNS Prefetch for External Resources -->
    <link rel="dns-prefetch" href="https://api.clerk.dev" />
    <link rel="dns-prefetch" href="https://images.unsplash.com" />
    <link rel="dns-prefetch" href="https://res.cloudinary.com" />
    
    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Store",
      "name": "ZYRA",
      "url": "https://zyra.com",
      "logo": "https://zyra.com/logo.png",
      "description": "Premium fashion and lifestyle store offering premium clothing, accessories, and lifestyle products.",
      "address": {
        "@type": "PostalAddress",
        "addressCountry": "US"
      },
      "sameAs": [
        "https://facebook.com/zyra",
        "https://instagram.com/zyra",
        "https://twitter.com/zyra"
      ]
    }
    </script>
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZYRA - Premium Fashion & Lifestyle Store</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
